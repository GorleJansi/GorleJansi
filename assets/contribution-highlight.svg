<svg width="1000" height="380" viewBox="0 0 1000 380" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Jansi Gorle contribution highlight</title>
  <desc id="desc">Clear GitHub contribution card showing 479 contributions in the last year with a readable activity heatmap and focus areas.</desc>
  <style>
    .page { fill: #f6f8fa; }
    .card { fill: #ffffff; stroke: #d0d7de; stroke-width: 2; }
    .soft { fill: #f0fdf4; stroke: #bbf7d0; stroke-width: 1.5; }
    .softblue { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1.5; }
    .softorange { fill: #fff7ed; stroke: #fed7aa; stroke-width: 1.5; }
    .title { fill: #111827; font: 800 32px Arial, sans-serif; }
    .subtitle { fill: #475569; font: 600 18px Arial, sans-serif; }
    .label { fill: #64748b; font: 700 14px Arial, sans-serif; letter-spacing: 1px; }
    .small { fill: #334155; font: 600 15px Arial, sans-serif; }
    .tiny { fill: #64748b; font: 600 12px Arial, sans-serif; }
    .number { fill: #16a34a; font: 900 92px Arial, sans-serif; }
    .green { fill: #16a34a; }
    .blue { fill: #2563eb; }
    .orange { fill: #ea580c; }
    .c0 { fill: #ebedf0; stroke: #d0d7de; stroke-width: 1; }
    .c1 { fill: #9be9a8; }
    .c2 { fill: #40c463; }
    .c3 { fill: #30a14e; }
    .c4 { fill: #216e39; }
  </style>

  <rect class="page" width="1000" height="380" rx="24" />
  <rect class="card" x="34" y="28" width="932" height="324" rx="22" />

  <text class="label" x="68" y="72">GITHUB ACTIVITY SNAPSHOT</text>
  <text class="number" x="68" y="164">479</text>
  <text class="title" x="286" y="120">contributions</text>
  <text class="subtitle" x="290" y="154">in the last year</text>
  <text class="small" x="290" y="184">Consistent public work across DevOps labs, cloud notes, automation, and SRE practice.</text>

  <rect class="soft" x="68" y="216" width="256" height="78" rx="16" />
  <circle class="green" cx="96" cy="244" r="9" />
  <text class="small" x="116" y="241">Build streak</text>
  <text class="tiny" x="116" y="266">Strong recent July activity</text>

  <rect class="softblue" x="356" y="216" width="256" height="78" rx="16" />
  <circle class="blue" cx="384" cy="244" r="9" />
  <text class="small" x="404" y="241">Project trail</text>
  <text class="tiny" x="404" y="266">Terraform, Kubernetes, Bash, DNS</text>

  <rect class="softorange" x="644" y="216" width="256" height="78" rx="16" />
  <circle class="orange" cx="672" cy="244" r="9" />
  <text class="small" x="692" y="241">Learning signal</text>
  <text class="tiny" x="692" y="266">Hands-on commits, docs, fixes</text>

  <text class="label" x="68" y="326">ACTIVITY HEATMAP</text>
  <text class="tiny" x="812" y="326">Less</text>
